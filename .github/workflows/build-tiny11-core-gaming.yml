# GitHub Actions Workflow for building Tiny11 Core-Gaming ISO
# Author: Sensei002 (https://github.com/Sensei002)
# Description: Fully automated Windows 11 Core ISO processing with the latency-first
#              Core-Gaming profile layered on top of tiny11coremaker.
# Repository: https://github.com/Sensei002/tiny11-automated
#
# Everything from "Build and Release Tiny11 Core" is preserved. The extra inputs below
# map 1:1 onto the groups in config/gaming_profile.json, so any of them can be turned
# off per build without touching the profile file.
#
# The Windows 11 ISO is resolved at run time: leaving windows_iso_url empty makes the
# workflow mint a fresh, language-specific link from Microsoft (scripts/resolve-windows-iso.ps1).
# Microsoft's links are signed and expire about 24 hours after generation, so resolving at
# run time avoids the stale-link failures a pasted URL suffers from.

name: Build and Release Tiny11 Core-Gaming

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Windows version (e.g., 24H2, 25H2, 26H2)'
        required: false
        default: '26H2'
      windows_iso_url:
        description: 'Optional. Leave EMPTY to resolve a fresh, language-specific link from Microsoft at run time (recommended - Microsoft links expire ~24h). Set only to pin one specific ISO.'
        required: false
        default: ''
      windows_build:
        description: 'Fallback Windows build number (e.g. 26200.8655) вЂ” only used if it cannot be read directly from the ISO'
        required: false
        default: ''
      image_index:
        description: 'Windows image index (1=Home, 4=Education, 6=Pro, 7=Pro N)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '4'
          - '6'
          - '7'
      language:
        description: 'ISO language - the same list Microsoft''s own download page offers. Used to resolve a fresh download link when windows_iso_url is left empty.'
        type: choice
        required: false
        default: 'English (United States)'
        options:
          - 'Arabic'
          - 'Brazilian Portuguese'
          - 'Bulgarian'
          - 'Chinese Simplified'
          - 'Chinese Traditional'
          - 'Croatian'
          - 'Czech'
          - 'Danish'
          - 'Dutch'
          - 'English (United States)'
          - 'English International'
          - 'Estonian'
          - 'Finnish'
          - 'French'
          - 'French Canadian'
          - 'German'
          - 'Greek'
          - 'Hebrew'
          - 'Hungarian'
          - 'Italian'
          - 'Japanese'
          - 'Korean'
          - 'Latvian'
          - 'Lithuanian'
          - 'Norwegian'
          - 'Polish'
          - 'Portuguese'
          - 'Romanian'
          - 'Russian'
          - 'Serbian Latin'
          - 'Slovak'
          - 'Slovenian'
          - 'Spanish'
          - 'Spanish (Mexico)'
          - 'Swedish'
          - 'Thai'
          - 'Turkish'
          - 'Ukrainian'
      skip_cleanup:
        description: 'Skip cleanup (for debugging)'
        required: false
        default: false
        type: boolean
      enable_dotnet35:
        description: 'Enable .NET Framework 3.5'
        type: boolean
        required: false
        default: false
      remove_defender:
        description: 'Completely remove Windows Defender / Security - no Antimalware service will be present in the finished image. Redundant on this workflow: Core-Gaming always removes Defender.'
        type: boolean
        required: false
        default: false
      account_setup:
        description: 'Local account setup. "auto-admin" = automatically create the local account "Admin" (OOBE skipped). "classic" = you create your own local account with your name during setup.'
        type: choice
        required: false
        default: 'auto-admin'
        options:
          - 'auto-admin'
          - 'classic'
      update_to_latest:
        description: 'Install the newest cumulative update Microsoft has published for this build before debloating, so the image is not stuck at the ISO build. "required" fails the build if the update cannot be applied, "best-effort" publishes the image at the ISO build instead, and "off" skips the update entirely. Adds a ~5 GB download and 20-40 minutes.'
        type: choice
        required: false
        default: 'required'
        options:
          - 'required'
          - 'best-effort'
          - 'off'
      pause_windows_update:
        description: 'Keep the Windows Update stack installed but paused until the year 3000. Checked (default): nothing is removed, so Settings shows a real paused state and the revert script can resume it - the machine stays quiet without Windows trying to repair a broken stack. Unchecked: Windows Update behaves exactly like a stock Windows 11 install.'
        type: boolean
        required: false
        default: true

      # ---------------- Gaming profile ----------------
      #
      # One preset plus two exceptions. The 14 group booleans that used to live here
      # are gone: this workflow sits at GitHub's 25 workflow_dispatch input cap, and a
      # 26th input makes the whole file unparseable - it then shows up in the Actions
      # UI named after its path and runs as a 0-job failure. The per-group switches
      # still exist, in config/gaming_profile.json, in the local builder's group
      # editor, and on the builder as -GamingGroups.
      gaming_tweaks:
        description: 'Gaming: apply the full Core-Gaming tweak set (all 14 profile groups at their defaults: power scheme, security mitigations off, Xbox stack removed, background noise stripped, instant windows, MPO off, input latency, interrupt latency, FSO off, Game Mode off, printing off). Uncheck for a bare Core image with only the two exceptions below.'
        type: boolean
        required: false
        default: true
      disable_cpu_idle:
        description: 'Gaming: Force CPU to C-State 0 (no idle). OFF by default - it stops turbo on a lot of hardware (a 3.6 GHz CPU then reads 3.4 GHz) and raises idle power. Enable only if you measured a wake-latency win. Independent of gaming_tweaks.'
        type: boolean
        required: false
        default: false
      hags:
        description: 'Gaming: Hardware Accelerated GPU Scheduling. "on" forces it on, "off" forces it off, "leave" keeps the Core default. Independent of gaming_tweaks.'
        type: choice
        required: false
        default: 'on'
        options:
          - 'on'
          - 'off'
          - 'leave'

env:
  ARIA2C_CONNECTIONS: '16'
  ARIA2C_SPLIT: '16'
  POWERSHELL_TELEMETRY_OPTOUT: '1'

jobs:
  build-tiny11-core-gaming:
    runs-on: windows-latest
    timeout-minutes: 480
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Record build start time
        shell: pwsh
        run: |
          $startUnix = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_START_UNIX=$startUnix"

      - name: Generate folder name and build parameters
        shell: pwsh
        run: |
          # ISO filename/tag are finalized later in "Verify tiny11 Core-Gaming ISO creation"
          $date = Get-Date -Format 'yyyy-MM-dd'
          $version = "${{ github.event.inputs.windows_version }}"

          $index = "${{ github.event.inputs.image_index }}"
          $editions = @{
              "1" = "Home"
              "4" = "Education"
              "6" = "Pro"
              "7" = "ProN"
          }
          $edition = $editions[$index]

          # The language now comes from a dropdown whose values are spelled exactly as
          # Microsoft spells them, e.g. 'English (United States)'. Filenames cannot carry
          # spaces or brackets, so every non-alphanumeric is dropped:
          #   'English (United States)' -> 'EnglishUnitedStates'
          #   'Spanish (Mexico)'        -> 'SpanishMexico'
          # Keeping the qualifier matters - 'Spanish' and 'Spanish (Mexico)' are different
          # ISOs, and a bare 'Spanish' filename would make them indistinguishable.
          $language = "${{ github.event.inputs.language }}" -replace '[^a-zA-Z0-9]', ''

          $folderName = "Tiny11CoreGaming-$edition-$version"

          Write-Output "Generated folder name: $folderName"

          Add-Content -Path $env:GITHUB_ENV -Value "FOLDER_NAME=$folderName"
          Add-Content -Path $env:GITHUB_ENV -Value "EDITION_NAME=$edition"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_DATE=$date"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_LANGUAGE=$language"

      - name: Validate gaming profile
        shell: pwsh
        run: |
          # Fail fast: a malformed profile would otherwise waste an hour of build time.
          $profilePath = "config\gaming_profile.json"
          $powerPath = "config\gaming_power_settings.json"

          if (-not (Test-Path $profilePath)) {
            Write-Error "Gaming profile not found at $profilePath"
            exit 1
          }
          if (-not (Test-Path $powerPath)) {
            Write-Error "Power settings not found at $powerPath"
            exit 1
          }

          try {
            $profile = Get-Content $profilePath -Raw | ConvertFrom-Json
            Write-Output "Gaming profile: $($profile.profile) (schema $($profile.schemaVersion))"
            Write-Output "Registry entries: $($profile.registry.Count)"
            Write-Output "Services:         $($profile.services.Count)"
            Write-Output "AppX prefixes:    $($profile.appxPrefixes.Count)"
            Write-Output "System packages:  $($profile.systemPackages.Count)"
            Write-Output "Optional features:$($profile.optionalFeatures.Count)"
          } catch {
            Write-Error "Gaming profile JSON is invalid: $_"
            exit 1
          }

          $power = Get-Content $powerPath -Raw | ConvertFrom-Json
          Write-Output "Power scheme: $($power.schemeName) with $($power.settings.Count) setting(s)"

          # The builder dot-sources this module, so a syntax error here would only show
          # up deep into the build.
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts\gaming-profile.ps1"), [ref]$null, [ref]$null)
          Write-Output "gaming-profile.ps1 parsed cleanly"

      - name: Validate essentials profile
        shell: pwsh
        run: |
          # The essentials pass has no toggle, so there is no way to skip it at build
          # time if the data is wrong. Validate with the real engine, which also runs
          # the boot-critical service guard - that is the check that stops a bad edit
          # from producing an unbootable image.
          $essentialsPath = "config\essentials_profile.json"
          if (-not (Test-Path $essentialsPath)) {
            Write-Error "Essentials profile not found at $essentialsPath"
            exit 1
          }

          # Import inside a strict-mode scope, exactly the way tiny11coremaker-headless.ps1
          # calls it. The builder runs under Set-StrictMode -Version Latest, and an empty
          # validation result unrolls to $null - $null.Count only throws under strict mode.
          # Without this the validation step passes while the build fails, which is what
          # happened in run 39375184068.
          $importEssentials = {
            Set-StrictMode -Version Latest
            . "scripts\essentials-profile.ps1"
            Initialize-EssentialsModule -LogFile $null -ProfileDirectory "config"
            Import-EssentialsProfile -Path $essentialsPath
          }

          try {
            $essentials = & $importEssentials
          } catch {
            Write-Error "Essentials profile is invalid: $_"
            exit 1
          }

          Write-Output "Essentials pass: $($essentials.profile) (schema $($essentials.schemaVersion))"
          Write-Output "Registry entries: $(@($essentials.registry).Count)"
          Write-Output "Key deletions:    $(@($essentials.deleteKeys).Count)"
          Write-Output "Services:         $(@($essentials.services).Count)"
          Write-Output "  manual (3):     $(@($essentials.services | Where-Object { $_.start -eq 3 }).Count)"
          Write-Output "  disabled (4):   $(@($essentials.services | Where-Object { $_.start -eq 4 }).Count)"

          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts\essentials-profile.ps1"), [ref]$null, [ref]$null)
          Write-Output "essentials-profile.ps1 parsed cleanly"

          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts\Tiny11-Report.ps1"), [ref]$null, [ref]$null)
          Write-Output "Tiny11-Report.ps1 parsed cleanly"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Discord - Build Started
        continue-on-error: true
        run: |
          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-started `
            --data (ConvertTo-Json @{
              version = "${{ inputs.windows_version }}"
              build_type = "Core-Gaming"
              edition = "$env:EDITION_NAME"
              preserve_winre = "true"
              enable_dotnet35 = "${{ inputs.enable_dotnet35 }}"
              gaming_profile = "core-gaming"
              hags_mode = "${{ inputs.hags }}"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILDS }}
        shell: pwsh

      - name: System information
        shell: pwsh
        run: |
          Write-Output "=== System Information (Tiny11 Core-Gaming Build) ==="
          Write-Output "OS: $(Get-CimInstance Win32_OperatingSystem | Select-Object -ExpandProperty Caption)"
          Write-Output "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Output "Architecture: $env:PROCESSOR_ARCHITECTURE"

          $disk = Get-PSDrive C
          $freeGB = [math]::Round($disk.Free / 1GB, 2)
          $totalGB = [math]::Round($disk.Used / 1GB + $disk.Free / 1GB, 2)
          Write-Output "Disk C: ${freeGB}GB free / ${totalGB}GB total"

          if ($freeGB -lt 25) {
            Write-Error "Insufficient disk space. At least 25GB required for a Core-Gaming build, found ${freeGB}GB"
            exit 1
          }

      - name: Install aria2c
        shell: pwsh
        run: |
          Write-Output "Installing aria2c for faster downloads..."
          choco install aria2 -y --no-progress
          aria2c --version

      # The two ISO steps below settle the download URL before anything expensive runs.
      # Resolving the link and proving it is alive takes seconds; discovering a dead link
      # after the ISO download has already started costs the whole run.
      - name: Resolve Windows 11 ISO URL
        # An empty windows_iso_url means "ask Microsoft for a fresh link". The links
        # Microsoft hands out are signed and expire ~24h, so minting one at run time is
        # more reliable than pasting one in and hoping it is still alive.
        if: ${{ github.event.inputs.windows_iso_url == '' }}
        shell: pwsh
        run: |
          $language = "${{ github.event.inputs.language }}"
          Write-Output "No ISO URL supplied - resolving a fresh link from Microsoft for '$language'..."

          try {
            $iso = & .\scripts\resolve-windows-iso.ps1 -Language $language
          } catch {
            Write-Output "::error title=ISO resolve failed::$($_.Exception.Message)"
            Write-Output ""
            Write-Output "Microsoft's download service refused to hand out a link. This is normally"
            Write-Output "temporary rate limiting or a blocked runner IP, and there is no way for this"
            Write-Output "workflow to work around it."
            Write-Output ""
            Write-Output "Fallback: download the ISO in a browser from"
            Write-Output "  https://www.microsoft.com/software-download/windows11"
            Write-Output "then re-run this workflow with that URL pasted into 'windows_iso_url'."
            exit 1
          }

          Write-Output "Resolved ISO: $($iso.FileName)"
          Write-Output "  language : $($iso.Language)"
          Write-Output "  SKU id   : $($iso.SkuId)"

          # Kept out of the log above: the URL carries a signed token.
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_ISO_URL=$($iso.Url)"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_LANGUAGE=$($iso.Language)"

      - name: Use supplied Windows 11 ISO URL
        if: ${{ github.event.inputs.windows_iso_url != '' }}
        shell: pwsh
        run: |
          Write-Output "A windows_iso_url was supplied - skipping auto-resolve."
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_ISO_URL=${{ github.event.inputs.windows_iso_url }}"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_LANGUAGE=${{ github.event.inputs.language }}"

      - name: Preflight - validate Windows ISO URL
        shell: pwsh
        run: |
          $url = $env:WINDOWS_ISO_URL

          # Microsoft's dbazure links are signed and time-limited (?t=...&P1=...&P4=...).
          # They expire roughly 24 hours after generation, so even a pinned URL can be dead
          # before the download starts. A single HEAD request settles it in under a second
          # and downloads zero bytes.
          $safeUrl = ($url -split '\?')[0]
          Write-Output "Checking ISO link: $safeUrl"

          $code = (& curl.exe -s -I -L --max-time 30 -o NUL -w '%{http_code}' "$url").Trim()

          # Some endpoints reject HEAD outright; fall back to a 1-byte ranged GET before
          # concluding the link is dead, so we never fail a valid URL over a probe quirk.
          if ($code -notin @('200', '206')) {
            Write-Output "HEAD returned HTTP $code - retrying with a 1-byte ranged GET..."
            $code = (& curl.exe -s -L --max-time 30 -r 0-0 -o NUL -w '%{http_code}' "$url").Trim()
          }

          Write-Output "ISO link responded with HTTP $code"

          if ($code -notin @('200', '206')) {
            Write-Output "::error title=Expired or invalid ISO URL::The Windows ISO link returned HTTP $code."
            Write-Output ""
            Write-Output "Microsoft download links are signed and expire about 24 hours after they are generated."
            Write-Output "Get a fresh link from https://www.microsoft.com/software-download/windows11 and pass it as"
            Write-Output "the 'windows_iso_url' input when re-running this workflow."
            exit 1
          }

          Write-Output "ISO link is live - proceeding."

      - name: Display build warnings
        shell: pwsh
        run: |
          Write-Output "=== TINY11 CORE-GAMING BUILD WARNINGS ==="
          Write-Output ""
          Write-Output "This build applies the Core-Gaming profile on top of Tiny11 Core."
          Write-Output ""
          Write-Output "Security features disabled by default in this workflow:"
          Write-Output "  - VBS / Memory Integrity (HVCI) / Credential Guard"
          Write-Output "  - Spectre / Meltdown kernel mitigations"
          Write-Output "  - Windows Defender (only when remove_defender is also true)"
          Write-Output "  - Hypervisor (hypervisorlaunchtype off)"
          Write-Output ""
          Write-Output "Functionality that will be broken:"
          Write-Output "  - Game Pass, Microsoft Store games, Xbox Play Anywhere"
          Write-Output "  - Printing (services and optional features removed)"
          Write-Output "  - Windows Search indexing"
          Write-Output "  - Bluetooth"
          Write-Output ""
          Write-Output "A revert script is shipped at C:\Windows\Tiny11Gaming\Undo-GamingTweaks.ps1"
          Write-Output "and a full manifest at C:\Windows\Tiny11Gaming\GAMING_PROFILE.md"
          Write-Output ""
          Write-Output "Build will continue in 10 seconds..."
          Start-Sleep -Seconds 10

      - name: Download Windows 11 ISO
        shell: pwsh
        run: |
          # Set by whichever of the two steps above ran: the Microsoft resolver, or the
          # windows_iso_url input. Never read the input directly here, or auto-resolve
          # would silently download nothing.
          $url = $env:WINDOWS_ISO_URL
          $output = "Win11_Source.iso"

          Write-Output "Downloading Windows 11 ISO from Microsoft servers..."
          Write-Output "URL: $($url.Substring(0, 100))..."

          $startTime = Get-Date

          aria2c `
            --console-log-level=info `
            --summary-interval=30 `
            --max-connection-per-server=${{ env.ARIA2C_CONNECTIONS }} `
            --split=${{ env.ARIA2C_SPLIT }} `
            --min-split-size=5M `
            --max-tries=5 `
            --retry-wait=3 `
            --timeout=60 `
            --connect-timeout=30 `
            --continue=true `
            --allow-overwrite=true `
            --auto-file-renaming=false `
            --file-allocation=none `
            --check-integrity=true `
            --out=$output `
            "$url"

          $downloadTime = (Get-Date) - $startTime

          if (-not (Test-Path $output)) {
            Write-Error "Download failed - ISO file not found"
            exit 1
          }

          $sizeGB = [math]::Round((Get-Item $output).Length / 1GB, 2)
          Write-Output "Download complete: ${sizeGB}GB in $($downloadTime.TotalMinutes.ToString('F2')) minutes"

      - name: Mount Windows ISO
        shell: pwsh
        run: |
          $isoPath = Join-Path $PWD "Win11_Source.iso"
          Write-Output "Mounting ISO: $isoPath"

          $mount = Mount-DiskImage -ImagePath $isoPath -PassThru -StorageType ISO

          $maxRetries = 10
          $retryCount = 0
          $driveLetter = $null

          while (-not $driveLetter -and $retryCount -lt $maxRetries) {
            Start-Sleep -Seconds 5
            try {
              $driveInfo = Get-Volume -DiskImage $mount -ErrorAction SilentlyContinue
              if ($driveInfo -and $driveInfo.DriveLetter) {
                $driveLetter = $driveInfo.DriveLetter
                Write-Output "Drive letter retrieved on attempt $($retryCount + 1): $driveLetter"
              }
            } catch {
              Write-Output "Attempt $($retryCount + 1) failed: $($_.Exception.Message)"
            }
            $retryCount++
          }

          if (-not $driveLetter) {
            Write-Error "Failed to retrieve drive letter after $maxRetries attempts"
            $drive = Get-CimInstance -ClassName Win32_LogicalDisk | Where-Object { $_.Description -eq "CD-ROM Disc" -and $_.DeviceID -ne $null }
            if ($drive) {
              $driveLetter = $drive.DeviceID.TrimEnd(":")
              Write-Output "Drive letter found via WMI: $driveLetter"
            } else {
              Write-Error "Failed to mount ISO or retrieve drive letter"
              exit 1
            }
          }

          Write-Output "ISO mounted successfully at drive: ${driveLetter}:"

          $requiredFiles = @(
            "${driveLetter}:\sources\boot.wim",
            "${driveLetter}:\sources\install.wim",
            "${driveLetter}:\sources\install.esd"
          )

          $foundFiles = $requiredFiles | Where-Object { Test-Path $_ }

          if ($foundFiles.Count -eq 0) {
            Write-Error "No install.wim or install.esd found on mounted ISO"
            exit 1
          }

          Write-Output "Found: $($foundFiles -join ', ')"

          Add-Content -Path $env:GITHUB_ENV -Value "ISO_DRIVE=$driveLetter"

      - name: Prepare autounattend.xml
        shell: pwsh
        run: |
          if (Test-Path "autounattend.xml") {
            Write-Output "Found local autounattend.xml"
            Copy-Item "autounattend.xml" "scripts\autounattend.xml" -Force
            Write-Output "Copied to scripts directory"
          } else {
            Write-Warning "autounattend.xml not found in root!"
          }

      - name: Verify headless script
        shell: pwsh
        run: |
          $scriptPath = ".\scripts\tiny11coremaker-headless.ps1"

          if (-not (Test-Path $scriptPath)) {
            Write-Error "Headless Core script not found at $scriptPath"
            Write-Output "Available files:"
            Get-ChildItem -Path . -Recurse -Filter "*.ps1" | ForEach-Object { Write-Output $_.FullName }
            exit 1
          }

          Write-Output "Headless Core script found: $scriptPath"
          Write-Output "Script size: $([math]::Round((Get-Item $scriptPath).Length / 1KB, 2)) KB"

      - name: Run tiny11coremaker (headless, Core-Gaming)
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force

          $params = @{
            ISO = $env:ISO_DRIVE
            INDEX = [int]"${{ github.event.inputs.image_index }}"
          }

          if ("${{ github.event.inputs.skip_cleanup }}" -eq "true") {
            $params.SkipCleanup = $true
            Write-Output "Cleanup will be skipped (debugging mode)"
          }

          # One tri-state input instead of two booleans, because GitHub allows at
          # most 25 workflow_dispatch inputs and the Core-Gaming workflow was
          # already at the cap. "required" is the default, so a published image
          # is always the current build.
          $updateMode = "${{ github.event.inputs.update_to_latest }}"
          if ([string]::IsNullOrWhiteSpace($updateMode)) { $updateMode = 'required' }
          if ($updateMode -eq 'off') {
            Write-Output "Skipping the cumulative update (update_to_latest = off)"
          } else {
            $params.UpdateToLatest = $true
            Write-Output "Will install the newest cumulative update before debloating (mode: $updateMode)"
            if ($updateMode -eq 'required') {
              $params.RequireLatestUpdate = $true
              Write-Output "The build fails if the update cannot be applied"
            }
          }

          $enableDotNet = [System.Boolean]::Parse("${{ github.event.inputs.enable_dotnet35 }}")
          # WinRE is always preserved - the builder has no switch for it any more.
          $removeDefender = ("${{ github.event.inputs.remove_defender }}" -eq "true")

          $accountSetup = "${{ github.event.inputs.account_setup }}"
          if ([string]::IsNullOrWhiteSpace($accountSetup)) { $accountSetup = 'auto-admin' }

          # One preset plus two exceptions.
          #
          # gaming_tweaks on  -> no overrides at all, so every group takes its default
          #                      from config/gaming_profile.json.
          # gaming_tweaks off -> every group forced off, which leaves a bare Core image
          #                      plus whatever the two exceptions below ask for.
          #
          # disable_cpu_idle is always written explicitly rather than left to the
          # profile default: it is the one group with a documented hardware downside, so
          # turning the preset on must not quietly enable it.
          $gamingTweaks = ("${{ github.event.inputs.gaming_tweaks }}" -ne 'false')
          $disableCpuIdle = ("${{ github.event.inputs.disable_cpu_idle }}" -eq 'true')

          $gamingGroups = @{}
          if (-not $gamingTweaks) {
            foreach ($group in @(
              'atlas_power_scheme', 'disable_security_mitigations', 'remove_xbox_gaming_stack',
              'strip_background_noise', 'instant_windows', 'disable_fast_startup',
              'network_latency_tweaks', 'disable_mpo', 'latency_input_tweaks',
              'interrupt_latency', 'disable_fso', 'disable_game_mode', 'disable_printing'
            )) { $gamingGroups[$group] = $false }
          }
          $gamingGroups['disable_cpu_idle'] = $disableCpuIdle

          $hagsMode = "${{ github.event.inputs.hags }}"
          if ([string]::IsNullOrWhiteSpace($hagsMode)) { $hagsMode = 'on' }

          # Paused is the default, so an unset input must mean paused rather than live.
          $pauseUpdates = ("${{ github.event.inputs.pause_windows_update }}" -ne 'false')
          $windowsUpdateMode = 'live'
          if ($pauseUpdates) { $windowsUpdateMode = 'paused' }

          Write-Output "=== Starting Tiny11 Core-Gaming Builder ==="
          Write-Output "ISO Drive: $($params.ISO)"
          Write-Output "Image Index: $($params.INDEX)"
          Write-Output ".NET 3.5: $enableDotNet"
          Write-Output "Preserve WinRE: always (the builder no longer has a toggle)"
          Write-Output "Remove Defender: $removeDefender"
          Write-Output "Account setup: $accountSetup"
          Write-Output "HAGS: $hagsMode"
          Write-Output "Gaming tweaks: $gamingTweaks"
          Write-Output "  [$(if ($disableCpuIdle) { 'ON ' } else { 'off' })] disable_cpu_idle (C-State 0)"
          Write-Output "Windows Update mode: $windowsUpdateMode"
          Write-Output "Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

          $startTime = Get-Date

          .\scripts\tiny11coremaker-headless.ps1 @params `
            -ENABLE_DOTNET35:$enableDotNet `
            -RemoveDefender:$removeDefender `
            -AccountSetup $accountSetup `
            -GamingProfile `
            -GamingGroups $gamingGroups `
            -HagsMode $hagsMode `
            -WindowsUpdateMode $windowsUpdateMode

          $buildTime = (Get-Date) - $startTime
          Write-Output "Core-Gaming build completed in $($buildTime.TotalMinutes.ToString('F2')) minutes"

      - name: Verify tiny11 Core-Gaming ISO creation
        shell: pwsh
        run: |
          $tempIso = "scripts\tiny11-core.iso"

          if (-not (Test-Path $tempIso)) {
            Write-Error "$tempIso was not created!"
            Write-Output "Contents of current directory:"
            Get-ChildItem -Path . | Format-Table Name, Length, LastWriteTime
            Write-Output "Contents of scripts directory:"
            Get-ChildItem -Path scripts | Format-Table Name, Length, LastWriteTime
            exit 1
          }

          # Real build number: from ISO metadata, else workflow_dispatch fallback
          $buildInfoPath = "scripts\tiny11core-buildinfo.json"
          $buildNumber = ""

          if (Test-Path $buildInfoPath) {
            try {
              $buildInfo = Get-Content -Path $buildInfoPath -Raw | ConvertFrom-Json
              $buildNumber = $buildInfo.windows_build
              Write-Output "Build number from ISO metadata: $buildNumber"
            } catch {
              Write-Output "Could not parse $buildInfoPath : $_"
            }
          }

          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
            $buildNumber = "${{ github.event.inputs.windows_build }}"
            if (-not [string]::IsNullOrWhiteSpace($buildNumber)) {
              Write-Output "Build number from workflow fallback input: $buildNumber"
            }
          }

          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
            Write-Error "Unable to determine Windows build number: ISO metadata extraction failed and no windows_build fallback input was provided. Refusing to publish an ISO without a verifiable build number."
            exit 1
          }

          # Report what the gaming layer actually did.
          $gamingInfoPath = "scripts\tiny11core-gaming-buildinfo.json"
          if (Test-Path $gamingInfoPath) {
            try {
              $gamingInfo = Get-Content -Path $gamingInfoPath -Raw | ConvertFrom-Json
              Write-Output "=== Gaming profile results ==="
              Write-Output "Profile:  $($gamingInfo.gaming_profile) (HAGS: $($gamingInfo.hags_mode))"
              Write-Output "Registry values applied: $($gamingInfo.counts.registry)"
              Write-Output "Services disabled:       $($gamingInfo.counts.services)"
              Write-Output "AppX packages removed:   $($gamingInfo.counts.appx)"
              Write-Output "System packages removed: $($gamingInfo.counts.packages)"
              Write-Output "Features removed:        $($gamingInfo.counts.features)"
            } catch {
              Write-Output "Could not parse $gamingInfoPath : $_"
            }
          } else {
            Write-Output "No gaming build info emitted - the gaming layer may not have run."
          }

          $version = "${{ github.event.inputs.windows_version }}"
          $language = "$env:BUILD_LANGUAGE"
          $edition = "$env:EDITION_NAME"
          $date = "$env:BUILD_DATE"

          $isoName = "Tiny11CoreGaming-$version-$buildNumber-$language-$edition-$date.iso"
          $baseTag = "$buildNumber-coregaming-$($edition.ToLower())"

          Write-Output "Generated ISO name: $isoName"
          Write-Output "Generated release tag: $baseTag"

          Add-Content -Path $env:GITHUB_ENV -Value "ISO_FILENAME=$isoName"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$baseTag"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_BUILD_NUMBER=$buildNumber"

          Move-Item -Path $tempIso -Destination $isoName -Force
          Write-Output "ISO moved and renamed to: $isoName"
          if (-not (Test-Path $isoName)) {
            Write-Error "$isoName was not created!"
            exit 1
          }

          $sizeGB = [math]::Round((Get-Item $isoName).Length / 1GB, 2)
          Write-Output "$isoName created successfully: ${sizeGB}GB"

          Write-Output "Generating checksums..."
          $sha256 = (Get-FileHash -Path $isoName -Algorithm SHA256).Hash
          $md5 = (Get-FileHash -Path $isoName -Algorithm MD5).Hash

          "$sha256  $isoName" | Out-File -FilePath "$isoName.sha256" -Encoding ASCII
          "$md5  $isoName" | Out-File -FilePath "$isoName.md5" -Encoding ASCII

          $verificationInfo = @"
          Tiny11 Core-Gaming ISO Verification
          ===================================
          File: $isoName
          Folder: $env:FOLDER_NAME
          Windows Build: $buildNumber
          Size: ${sizeGB}GB
          Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          Image Index: ${{ github.event.inputs.image_index }}
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          BUILD TYPE: TINY11 CORE-GAMING (latency-first, AtlasOS-style)
          WinRE: Preserved
          .NET 3.5: ${{ github.event.inputs.enable_dotnet35 }}
          HAGS: ${{ github.event.inputs.hags }}

          SECURITY FEATURES DISABLED
            VBS / Memory Integrity / Credential Guard : ${{ github.event.inputs.gaming_tweaks }}
            Spectre / Meltdown mitigations             : ${{ github.event.inputs.gaming_tweaks }}
            Windows Defender removed                   : ${{ github.event.inputs.remove_defender }}
            Hypervisor (hypervisorlaunchtype)          : off

          WINDOWS UPDATE
            Mode: ${{ github.event.inputs.pause_windows_update == 'false' && 'live (stock Windows Update)' || 'paused until 3000-01-01' }}

          Revert script inside the image:
            C:\Windows\Tiny11Gaming\Undo-GamingTweaks.ps1
          Applied-tweak manifest inside the image:
            C:\Windows\Tiny11Gaming\GAMING_PROFILE.md

          SHA256: $sha256
          MD5: $md5

          To verify:
            certutil -hashfile $isoName SHA256
          "@

          $verificationInfo | Out-File -FilePath "$isoName.txt" -Encoding UTF8

          Write-Output ""
          Write-Output "=== TINY11 CORE-GAMING BUILD SUMMARY ==="
          Write-Output "Build completed: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Output "Output size: ${sizeGB}GB"
          Write-Output "SHA256: $sha256"
          Write-Output "========================================"

          Add-Content -Path $env:GITHUB_ENV -Value "ISO_NAME=$isoName"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_SIZE_GB=$sizeGB"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_SHA256=$sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_MD5=$md5"

      - name: Discord - Build Completed
        if: success()
        continue-on-error: true
        run: |
          $isoSize = if ($env:ISO_SIZE_GB) {
            "$env:ISO_SIZE_GB GB"
          } else {
            $isoPath = Get-ChildItem -Path . -Filter "*.iso" -Recurse | Select-Object -First 1
            if ($isoPath) { "{0:N2} GB" -f ($isoPath.Length / 1GB) } else { "Unknown" }
          }

          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_START_UNIX
          $duration = "{0}m {1}s" -f [math]::Floor($elapsed / 60), ($elapsed % 60)

          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-completed `
            --data (ConvertTo-Json @{
              version = "${{ inputs.windows_version }}"
              build_type = "Core-Gaming"
              edition = "$env:EDITION_NAME"
              duration = $duration
              iso_size = $isoSize
              download_url = "https://sourceforge.net/projects/tiny11-automated/"
              preserve_winre = "true"
              enable_dotnet35 = "${{ inputs.enable_dotnet35 }}"
              gaming_profile = "core-gaming"
              hags_mode = "${{ inputs.hags }}"
              windows_build = "$env:WINDOWS_BUILD_NUMBER"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILDS }}
        shell: pwsh

      - name: Cleanup before upload
        shell: pwsh
        run: |
          Write-Output "Cleaning up to free disk space..."

          $isoPath = Join-Path $PWD "Win11_Source.iso"
          if (Test-Path $isoPath) {
            Get-DiskImage -ImagePath $isoPath | Dismount-DiskImage -ErrorAction SilentlyContinue
            Write-Output "ISO unmounted"
          }

          Remove-Item "Win11_Source.iso" -Force -ErrorAction SilentlyContinue

          Get-ChildItem -Path . -Filter "*.log" | Where-Object { $_.Length -gt 10MB } | Remove-Item -Force

          $disk = Get-PSDrive C
          $freeGB = [math]::Round($disk.Free / 1GB, 2)
          Write-Output "Available space after cleanup: ${freeGB}GB"

      - name: Check upload configuration
        id: check-upload
        shell: pwsh
        env:
          SF_KEY: ${{ secrets.SF_SSH_KEY }}
          ENABLE_UPLOAD: ${{ vars.ENABLE_SOURCEFORGE_UPLOAD }}
        run: |
          if ($env:ENABLE_UPLOAD -eq 'true' -or -not [string]::IsNullOrWhiteSpace($env:SF_KEY)) {
            Write-Output "Upload condition met."
            "DO_UPLOAD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          } else {
            Write-Output "Upload condition NOT met. Fallback to artifacts."
            "DO_UPLOAD=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          }

      - name: Validate SourceForge credentials
        if: env.DO_UPLOAD == 'true'
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SF_SSH_KEY)) {
            Write-Error "SF_SSH_KEY secret is not configured"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:SF_USERNAME)) {
            Write-Error "SF_USERNAME secret is not configured"
            exit 1
          }

          Write-Output "Credentials validated successfully"

      - name: Setup SSH for SourceForge
        if: env.DO_UPLOAD == 'true'
        shell: pwsh
        env:
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SF_SSH_KEY)) { Write-Error "Secret SF_SSH_KEY is missing"; exit 1 }

          if ([string]::IsNullOrWhiteSpace($env:SF_PROJECT)) {
            $env:SF_PROJECT = "${{ github.event.repository.name }}"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "SF_PROJECT=$env:SF_PROJECT"

          $sshDir = "$env:USERPROFILE\.ssh"
          if (!(Test-Path $sshDir)) { New-Item -ItemType Directory -Force -Path $sshDir | Out-Null }

          $keyPath = "$sshDir\sf_key"

          try {
            $keyBytes = [System.Convert]::FromBase64String($env:SF_SSH_KEY)
            [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          } catch {
            Write-Error "Failed to decode SF_SSH_KEY. Did you Base64 encode it in Termux first?"
            exit 1
          }

          icacls $keyPath /c /t /inheritance:d
          icacls $keyPath /c /t /grant "${env:USERNAME}:F"
          icacls $keyPath /c /t /remove Administrator "Authenticated Users" BUILTIN\Administrators BUILTIN\Users

          ssh-keyscan -t rsa,ecdsa,ed25519 frs.sourceforge.net | Out-File -FilePath "$sshDir\known_hosts" -Encoding ascii

          Write-Output "SSH configuration complete."

      - name: Upload to SourceForge (Recursive Method)
        if: env.DO_UPLOAD == 'true'
        shell: pwsh
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT || github.event.repository.name }}
          ISO_NAME: ${{ env.ISO_NAME }}
          FOLDER_NAME: ${{ env.FOLDER_NAME }}
        run: |
          $keyPath = "$env:USERPROFILE\.ssh\sf_key"

          Write-Output "Organizing files into folder: $env:FOLDER_NAME"
          New-Item -ItemType Directory -Force -Path $env:FOLDER_NAME | Out-Null

          # Only the ISO is published to SourceForge, so a release folder is a plain
          # list of images. The checksums and the verification file stay as GitHub
          # release assets and in the workflow artifact.
          Copy-Item $env:ISO_NAME $env:FOLDER_NAME

          if (Test-Path "SOURCEFORGE_README.md") {
            Copy-Item "SOURCEFORGE_README.md" $env:FOLDER_NAME
            Write-Output "Copied SOURCEFORGE_README.md to folder"
          }

          $remoteRoot = "$env:SF_USERNAME@frs.sourceforge.net:/home/frs/project/$env:SF_PROJECT/"

          # Keepalives, because a stalled connection otherwise hangs until the job
          # timeout. An earlier run sat here for 17 minutes having written zero
          # bytes and would have burned all 360. ServerAliveInterval=15 with
          # CountMax=4 gives up on a dead peer in about a minute, and one retry
          # covers the case where it was the connection rather than the file.
          $scpOptions = @(
            '-o', 'StrictHostKeyChecking=no',
            '-o', 'ConnectTimeout=30',
            '-o', 'ServerAliveInterval=15',
            '-o', 'ServerAliveCountMax=4'
          )

          $scpExit = 1
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Output "Uploading folder (attempt $attempt of 2)..."
            scp -i $keyPath -r @scpOptions $env:FOLDER_NAME $remoteRoot
            $scpExit = $LASTEXITCODE
            if ($scpExit -eq 0) { break }
            Write-Output "SCP exited with $scpExit"
            if ($attempt -lt 2) { Start-Sleep -Seconds 15 }
          }

          if ($scpExit -ne 0) {
            Write-Error "SCP Upload failed after 2 attempt(s)"
            exit 1
          }
          Write-Output "Upload success!"

          $downloadUrl = "https://sourceforge.net/projects/$env:SF_PROJECT/files/$env:FOLDER_NAME/$env:ISO_NAME/download"
          Add-Content -Path $env:GITHUB_ENV -Value "SF_DOWNLOAD_URL=$downloadUrl"

      - name: Cleanup SSH credentials
        if: always()
        shell: pwsh
        run: |
          $keyPath = "$env:USERPROFILE\.ssh\sf_key"
          if (Test-Path $keyPath) {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
            Write-Output "SSH key cleaned up"
          }

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
            ${{ env.ISO_NAME }}.txt
          retention-days: 7
          compression-level: 0

      - name: Upload gaming profile report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gaming-profile-report-${{ github.run_id }}
          path: |
            scripts/tiny11core-gaming-buildinfo.json
            config/gaming_profile.json
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Tiny11 Core-Gaming Windows 11 ${{ github.event.inputs.windows_version }} - ${{ env.RELEASE_TAG }}
          body: |
            ## рџЋ® Tiny11 Core-Gaming Windows 11 ${{ github.event.inputs.windows_version }}

            **Latency-first, AtlasOS-style build on top of Tiny11 Core.**

            ### рџ“¦ Build Information
            - **Built with:** [tiny11builder](https://github.com/ntdevlabs/tiny11builder) by ntdevlabs
            - **Modified by:** [Sensei002](https://github.com/Sensei002)
            - **Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### рџ“Ґ Download
            ${{ secrets.SF_SSH_KEY != '' && format('**SourceForge:** [{0}]({1})', env.ISO_NAME, env.SF_DOWNLOAD_URL) || '**GitHub Artifacts:** Check workflow run for download' }}

            ### рџ’ї Image Details
            | Property | Value |
            |----------|-------|
            | **File** | ${{ env.ISO_NAME }} |
            | **Size** | ${{ env.ISO_SIZE_GB }}GB |
            | **Type** | Core-Gaming (latency-first) |
            | **Base** | Windows 11 ${{ github.event.inputs.windows_version }} |
            | **Index** | ${{ github.event.inputs.image_index }} |
            | **HAGS** | ${{ github.event.inputs.hags }} |
            | **WinRE** | Preserved |

            ### вљЎ Applied in this build
            | Group | State |
            |-------|-------|
            | Gaming tweaks (full preset) | ${{ github.event.inputs.gaming_tweaks == 'false' && 'вќЊ' || 'вњ…' }} |
            | CPU idle disabled (C-State 0) | ${{ github.event.inputs.disable_cpu_idle == 'true' && 'вњ…' || 'вќЊ' }} |
            | HAGS | ${{ github.event.inputs.hags }} |
            | Windows Update | ${{ github.event.inputs.pause_windows_update == 'false' && 'live' || 'paused until 3000-01-01' }} |

            ### вљ пёЏ Security Notice
            This image disables VBS / Memory Integrity, Credential Guard and the
            Spectre/Meltdown kernel mitigations by default, and removes Defender when
            `remove_defender` is set. That is a deliberate, measurable performance
            trade-off вЂ” **not a safe daily-driver configuration.**

            ### рџ”Ѓ Reverting
            Two files ship inside the image:
            - `C:\Windows\Tiny11Gaming\Undo-GamingTweaks.ps1` вЂ” restores the reversible settings
            - `C:\Windows\Tiny11Gaming\GAMING_PROFILE.md` вЂ” the exact list of what was changed

            ### вќЊ What's Removed
            - **Windows Component Store (WinSxS)**
            - **Xbox / Gaming Services** (breaks Game Pass and Microsoft Store games)
            - **Printing** (services and optional features)
            - Microsoft Edge, OneDrive, Teams, Copilot, Chat
            - Telemetry, diagnostics, background apps

            ### рџ”„ Windows Update
            The update stack is **not removed**. It ships intact and paused until
            3000-01-01, so Settings shows a real paused state instead of a broken one,
            and `Undo-GamingTweaks.ps1` can resume it by clearing the pause keys.

            Be aware that a Core image also minimises WinSxS, so resuming updates on
            this build will most likely fail to install them. The pause exists to keep
            the machine quiet and reversible вЂ” it is not a promise that the image can
            be patched later. Build with `pause_windows_update` unchecked for stock
            Windows Update behaviour.

            ### рџ”’ Checksums

            **SHA256:**
            ```
            ${{ env.ISO_SHA256 }}
            ```

            **MD5:**
            ```
            ${{ env.ISO_MD5 }}
            ```

            ---

            **вљ пёЏ Disclaimer:** This is an unofficial Windows 11 modification. Use at your own risk. Not affiliated with Microsoft. Requires a valid Windows license.
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
            ${{ env.ISO_NAME }}.txt
            tiny11.ps1

      - name: Workflow summary
        shell: pwsh
        run: |
          $summary = @"
          # вњ… Tiny11 Core-Gaming Build Completed

          ## рџ“¦ Build Information
          - **ISO:** $env:ISO_NAME
          - **Size:** $env:ISO_SIZE_GB GB
          - **Release:** ${{ env.RELEASE_TAG }}
          - **Version:** ${{ github.event.inputs.windows_version }}
          - **Type:** Core-Gaming (latency-first, AtlasOS-style)
          - **HAGS:** ${{ github.event.inputs.hags }}
          - **WinRE:** Preserved

          ## рџ“Ґ Download
          ${{ secrets.SF_SSH_KEY != '' && format('рџ”— **SourceForge:** [{0}]({1})', env.ISO_NAME, env.SF_DOWNLOAD_URL) || 'рџ”— **GitHub Artifacts:** Available in workflow run' }}

          ## рџ”’ Checksums
          **SHA256:** ``````
          $env:ISO_SHA256
          ``````

          ## вљ пёЏ Security Notice
          VBS / Memory Integrity, Credential Guard and Spectre-Meltdown mitigations are
          disabled in this image by default. Revert with
          ``C:\Windows\Tiny11Gaming\Undo-GamingTweaks.ps1``.

          ## вЏ±пёЏ Build Time
          Completed at: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')

          ---
          Built by [Sensei002](https://github.com/Sensei002) | Original by [ntdevlabs](https://github.com/ntdevlabs)
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Capture build error for Discord
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $logFile = Get-ChildItem -Path scripts -Filter "tiny11-core_*.log" -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime -Descending |
                     Select-Object -First 1
          if ($logFile) {
            $errorLines = Select-String -Path $logFile.FullName -Pattern '\[ERROR\]' |
                          Select-Object -Last 10 |
                          ForEach-Object { $_.Line }
            $errorSummary = if ($errorLines) {
              $errorLines -join "`n"
            } else {
              (Get-Content $logFile.FullName -Tail 5) -join "`n"
            }
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_ERROR_SUMMARY<<EOF"
            Add-Content -Path $env:GITHUB_ENV -Value $errorSummary
            Add-Content -Path $env:GITHUB_ENV -Value "EOF"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_ERROR_SUMMARY=No builder log found вЂ” check step outputs above."
          }

      - name: Upload build log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-core-gaming-build-log-${{ github.run_id }}
          path: scripts/tiny11-core_*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Discord - Build Failed
        if: failure()
        continue-on-error: true
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_START_UNIX
          $duration = "{0}m {1}s" -f [math]::Floor($elapsed / 60), ($elapsed % 60)

          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-failed `
            --data (ConvertTo-Json @{
              version = "${{ inputs.windows_version }}"
              build_type = "Core-Gaming"
              edition = "$env:EDITION_NAME"
              duration = $duration
              error = $env:BUILD_ERROR_SUMMARY
              logs_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              gaming_profile = "core-gaming"
              hags_mode = "${{ inputs.hags }}"
              windows_build = "$env:WINDOWS_BUILD_NUMBER"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
        shell: pwsh
